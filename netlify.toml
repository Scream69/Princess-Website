# Netlify build settings, committed so the deploy is reproducible rather than
# configured by hand in a dashboard nobody remembers changing.
#
# Cloudflare Pages ignores this file. Its equivalent settings are in the
# README, and the headers below also work there via public/_headers.
#
# The account must be the CLIENT'S, not ours (CLAUDE.md 3).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local toolchain rather than whatever the platform defaults to.
  NODE_VERSION = "24"
  # Netlify sets CI=true, which turns npm warnings into failures on some
  # setups. The build has no warnings today; this keeps a future one from
  # taking the site down.
  NPM_FLAGS = "--no-audit --no-fund"

# PUBLIC_WEB3FORMS_KEY, PUBLIC_ANALYTICS_DOMAIN and PUBLIC_ANALYTICS_SRC are
# set in the Netlify UI, not here — this file is committed, and a key in a
# repository is a key that has leaked. They are build-time values: changing
# one needs a redeploy, not just a save.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Astro fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
